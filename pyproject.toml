[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stage-vla-v7"
version = "7.0.0"
description = "Auditable vision-language-action orchestration with Isaac Lab integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.4"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
stage-vla-v7 = "stage_vla_v7.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
